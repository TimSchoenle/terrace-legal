name: docs

# `README.md` is generated from `.github/templates/README.md.hbs`. On a pull request the `render`
# job in generate.yaml renders it and generate-commit.yaml commits the result, so nothing the
# README quotes about itself is edited by hand.
#
# Everywhere nothing commits — a push to `main`, a pull request from a fork — this workflow renders
# in `check` mode instead, writing nothing and failing if the committed `README.md` is stale.
# Without it, editing `README.md` directly would appear to work right up until the next pull
# request silently reverted it.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: readme
    # The complement of the `render` job in generate.yaml: it covers the pushes to `main` that no
    # pull request rendered, and the fork pull requests that could not be committed to.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Generate the configuration payload
        id: config
        run: |
          set -euo pipefail
          json="$(bash .github/scripts/readme-variables.sh)"
          echo "json=${json}" >> "$GITHUB_OUTPUT"
          # The root manifest is a virtual workspace, which the action cannot read a version from.
          bash .github/scripts/readme-variables.sh --emit-manifest .readme-manifest/Cargo.toml

      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-common-readme-variables-v2.1.1
        with:
          branch: ${{ github.event.repository.default_branch }}
          manifest: .readme-manifest/Cargo.toml
          extra: ${{ steps.config.outputs.json }}

      # Writes nothing; fails with the first differing line when README.md is stale.
      - name: Verify README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-common-render-template-v3.0.1
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}
          check: true
