# One version for all five crates: every consumer pins a single tag, so mixed versions would
# describe combinations nobody can install.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0" # x-release-please-version
description = "Operator-configured legal documents: configuration, validation, HTTP serving and a Dioxus frontend."
edition = "2024"
rust-version = "1.94"
authors = ["Tim Schönle"]
license = "MIT"
repository = "https://github.com/TimSchoenle/terrace-legal"
# Distributed as a git dependency. `publish = false` prevents an accidental `cargo publish`
# while leaving the names reservable on crates.io.
publish = false

[workspace.dependencies]
terrace-legal-model = { version = "0.2.0", path = "crates/terrace-legal-model" } # x-release-please-version
terrace-legal = { version = "0.2.0", path = "crates/terrace-legal" } # x-release-please-version
terrace-legal-axum = { version = "0.2.0", path = "crates/terrace-legal-axum" } # x-release-please-version
terrace-legal-dioxus = { version = "0.2.0", path = "crates/terrace-legal-dioxus" } # x-release-please-version
terrace-legal-markdown = { version = "0.2.0", path = "crates/terrace-legal-markdown" } # x-release-please-version

terrace-config = { git = "https://github.com/TimSchoenle/terrace-config", tag = "v0.12.0", version = "0.12.0", default-features = false, features = ["loader", "schema"] }

axum = { version = "0.8.9", default-features = false, features = ["json", "query", "original-uri"] }
base64 = "0.23.1"
dioxus = { version = "0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks"] }
dioxus-core = "0.7.10"
dioxus-ssr = "0.7.10"
http = "1.5.0"
http-body-util = "0.1.5"
proptest = "1.11.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
time = { version = "0.3.55", default-features = false }
tokio = "1.53.1"
tokio-util = "0.7.19"
tower = { version = "0.5.3", default-features = false }
url = "2.5.8"
utoipa = "5.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_docs = "warn"

[workspace.lints.clippy]
# `#[expect(…, reason = "…")]`, never a bare `#[allow(…)]`: an `allow` stays silently forever,
# an `expect` warns the moment its claim stops holding.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"
too_long_first_doc_paragraph = "warn"
doc_link_with_quotes = "warn"
doc_broken_link = "warn"
doc_include_without_cfg = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
unescaped_backticks = "warn"
