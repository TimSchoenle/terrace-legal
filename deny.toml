# `cargo deny check`. Run in CI on every push and on the weekly schedule: the advisory database
# moves without this repository changing, so a filtered run is not enough.

[graph]
all-features = true

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
    # `libfuzzer-sys`, which only the separate fuzz workspace links.
    "NCSA",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A path dependency between private crates has no version to pin, so the fuzz workspace can name
# the library by path.
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The configuration loader is consumed as a tagged git dependency.
allow-git = ["https://github.com/TimSchoenle/terrace-config"]
