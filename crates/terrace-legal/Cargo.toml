[package]
name = "terrace-legal"
description = "Configuration, validation and serving state for operator-configured legal documents, built on terrace-config."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# The `[…consent]` configuration keys, `ConsentStore` and registration verification.
consent = ["terrace-legal-model/consent", "dep:time"]
# `LegalFixture` over `terrace_config::testing::Harness`, and the consent conformance suite. For
# dev-dependencies only.
testing = ["terrace-config/testing"]

[dependencies]
base64 = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
terrace-config = { workspace = true }
terrace-legal-model = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, optional = true, features = ["parsing", "formatting"] }
url = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
terrace-config = { workspace = true, features = ["testing", "reload"] }
time = { workspace = true, features = ["macros", "parsing", "formatting"] }
tokio = { workspace = true, features = ["macros", "rt", "time", "sync"] }
tokio-util = { workspace = true }

[lints]
workspace = true
